<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#2e7d32">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Farm Advisor</title>
<style>
:root{--bg:#f4f7f1;--card:#fff;--tx:#1d2b1f;--mut:#5b6b5e;--pri:#2e7d32;--bd:#d6e0d3;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root{--bg:#121a14;--card:#1b261e;--tx:#e6efe6;--mut:#9db0a0;--pri:#66bb6a;--bd:#2f3f33}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font-family:system-ui,-apple-system,"Segoe UI",Tahoma,sans-serif;line-height:1.7}
main{max-width:640px;margin:0 auto;padding:16px}
.top{display:flex;justify-content:space-between;align-items:center;gap:10px}
.top select{width:auto}
h1{font-size:1.4rem;margin:8px 0 2px}
.sub{color:var(--mut);margin:0 0 14px;font-size:.9rem}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:14px;margin-bottom:12px}
.card h2{font-size:1rem;margin:0 0 10px;color:var(--pri)}
label{display:block;font-size:.85rem;color:var(--mut);margin:8px 0 3px}
input,select{width:100%;padding:10px;border-radius:10px;border:1px solid var(--bd);background:var(--bg);color:var(--tx);font-size:1rem;font-family:inherit}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
button{width:100%;padding:13px;border:0;border-radius:12px;background:var(--pri);color:#fff;font-size:1.05rem;font-weight:600;font-family:inherit;margin-top:10px}
button.sec{background:transparent;color:var(--pri);border:1px solid var(--pri);font-size:.9rem;padding:9px}
button:disabled{opacity:.5}
#prev,.pimg{max-width:100%;max-height:220px;border-radius:10px;margin-top:8px;display:none}
.pimg{display:block}
.res h3{font-size:.95rem;margin:14px 0 4px;color:var(--pri)}
.res ul{margin:4px 0;padding-inline-start:20px}
.res p{margin:4px 0}
.warn{color:#c62828}
.chk{display:flex;gap:8px;align-items:flex-start;margin:4px 0;font-size:.92rem}
.chk input{width:auto;margin-top:6px}
.tr{color:#1565c0}.pv{color:#2e7d32}
details{border:1px solid var(--bd);border-radius:10px;padding:6px 10px;margin:6px 0}
summary{font-weight:600}
.note{font-size:.8rem;color:var(--mut)}
</style>
</head>
<body>
<main>
<div class="top"><h1 id="ttl"></h1>
<select id="lang"><option value="ar">العربية</option><option value="fr">Français</option><option value="en">English</option></select></div>
<p class="sub" data-t="sub"></p>
<div id="today"></div>

<div class="card"><h2 data-t="s1"></h2>
<div class="row"><div><label data-t="lat"></label><input id="lat" inputmode="decimal" placeholder="16.51"></div>
<div><label data-t="lon"></label><input id="lon" inputmode="decimal" placeholder="-15.81"></div></div>
<button class="sec" id="gps" type="button" data-t="gps"></button>
<div class="row"><div><label data-t="rain"></label><input id="rain" inputmode="decimal"></div>
<div><label data-t="temp"></label><input id="temp" inputmode="decimal"></div></div>
<div class="row"><div><label data-t="tmax"></label><input id="tmax" inputmode="decimal"></div><div><label data-t="tmin"></label><input id="tmin" inputmode="decimal"></div></div>
<button class="sec" id="wxb" type="button" data-t="wxb"></button>
<div id="wxo" class="note" style="white-space:pre-wrap"></div>
<p class="note" data-t="wxnote"></p></div>

<div class="card"><h2 data-t="s2"></h2>
<label data-t="crop"></label><select id="crop"></select>
<div class="row"><div><label data-t="sow"></label><input id="sow" type="date"></div>
<div><label data-t="area"></label><input id="area" inputmode="decimal" placeholder="1000"></div></div>
<div class="row"><div><label data-t="env"></label><select id="env"></select></div>
<div><label data-t="season"></label><select id="season"></select></div></div>
<label data-t="irr"></label><select id="irr"></select>
<label data-t="ec"></label><select id="ec"></select></div>

<div class="card"><h2 data-t="s3"></h2>
<div class="row"><div><label data-t="soil"></label><select id="soil"></select></div>
<div><label data-t="comp"></label><select id="comp"></select></div></div></div>

<div class="card"><h2 data-t="s4"></h2>
<div class="row"><button class="sec" id="cam" type="button" data-t="photoCam"></button><button class="sec" id="pick" type="button" data-t="photoPick"></button></div>
<input id="f1" type="file" accept="image/*" capture="environment" hidden>
<input id="f2" type="file" accept="image/*" hidden>
<img id="prev" alt="">
<p class="note" data-t="photoNote"></p>
<label data-t="symHdr"></label>
<div id="sym"></div></div>

<div class="card"><h2 data-t="s5"></h2>
<div class="row"><div><label data-t="plen"></label><input id="plen" inputmode="decimal"></div>
<div><label data-t="pdist"></label><input id="pdist" inputmode="decimal" placeholder="20"></div></div>
<label data-t="pflow"></label><input id="pflow" inputmode="decimal">
<p class="note" data-t="pnote"></p></div>

<button id="go" type="button" data-t="go"></button>
<div class="card res" id="res" style="display:none;margin-top:12px"><h2 data-t="resT"></h2><div id="out"></div><button class="sec" id="cp" type="button"></button></div>
<div class="card"><h2 data-t="s6"></h2>
<p class="note" data-t="alnote"></p>
<label data-t="rtime"></label><input id="rtime" type="time" value="06:30">
<button class="sec" id="ics" type="button" data-t="ics"></button>
<button class="sec" id="notif" type="button" data-t="notif"></button>
<div id="alo" class="note"></div></div>

<div class="card"><h2 data-t="s7"></h2>
<div class="row"><div><label data-t="sdate"></label><input id="sd" type="date"></div>
<div><label data-t="starget"></label><select id="st"></select></div></div>
<label data-t="sprod"></label><input id="sp" list="spl" autocomplete="off"><datalist id="spl"></datalist>
<div class="row"><div><label data-t="sqty"></label><input id="sq" inputmode="decimal"></div>
<div><label data-t="sunit"></label><select id="su"></select></div></div>
<div class="row"><div><label data-t="svol"></label><input id="sv" inputmode="decimal"></div>
<div><label data-t="sarea"></label><input id="sa" inputmode="decimal"></div></div>
<label data-t="snote"></label><input id="sn">
<button id="ssave" type="button" data-t="ssave"></button>
<div id="slist"></div>
<button class="sec" id="scopy" type="button" data-t="scopy"></button></div>

<p class="note" data-t="disc"></p>
</main>
<script>
const IS={};
function I3(id,g,ar,fr,en){IS[id]={g,ar:{n:ar[0],s:ar[1],t:ar[2],p:ar[3]},fr:{n:fr[0],s:fr[1],t:fr[2],p:fr[3]},en:{n:en[0],s:en[1],t:en[2],p:en[3]}}}
I3('nit','old',[`نقص النيتروجين (N)`,`اصفرار الأوراق السفلى (القديمة) يبدأ من الأسفل`,`سماد غني بالنيتروجين (نترات الأمونيوم أو 30-10-10) مع ماء الري`,`تسميد مجزّأ منتظم وإضافة كومبوست`],
[`Carence en azote (N)`,`Jaunissement des vieilles feuilles du bas`,`Engrais azoté (nitrate d’ammonium ou 30-10-10) en fertigation`,`Fertilisation fractionnée régulière et compost`],
[`Nitrogen (N) deficiency`,`Older lower leaves turning uniformly yellow`,`Nitrogen fertilizer (ammonium nitrate or 30-10-10) through irrigation`,`Regular split fertigation and compost`]);
I3('pot','old',[`نقص البوتاسيوم (K)`,`حواف الأوراق القديمة بنية محروقة مع تجعد`,`نترات البوتاسيوم مع الري`,`تسميد متوازن بالبوتاسيوم وتجنّب الماء المالح`],
[`Carence en potassium (K)`,`Bords bruns brûlés des vieilles feuilles`,`Nitrate de potassium en fertigation`,`Fertilisation potassique équilibrée, éviter l’eau salée`],
[`Potassium (K) deficiency`,`Scorched brown edges on older leaves`,`Potassium nitrate through irrigation`,`Balanced potassium feeding; avoid saline water`]);
I3('mag','old',[`نقص المغنيسيوم (Mg)`,`اصفرار بين العروق مع بقاء العروق خضراء في الأوراق القديمة`,`رش كبريتات المغنيسيوم 0.5% (5 غ/لتر) أسبوعياً لمدة 3 أسابيع`,`تجنّب الإفراط في البوتاسيوم وأضف المغنيسيوم في التسميد`],
[`Carence en magnésium (Mg)`,`Jaunissement entre les nervures des vieilles feuilles (nervures vertes)`,`Pulvériser du sulfate de magnésium à 0,5 % (5 g/L) chaque semaine pendant 3 semaines`,`Éviter l’excès de potassium; apporter du Mg en fertigation`],
[`Magnesium (Mg) deficiency`,`Yellowing between veins of older leaves (veins stay green)`,`Spray magnesium sulfate 0.5% (5 g/L) weekly for 3 weeks`,`Avoid excess potassium; include Mg in fertigation`]);
I3('pho','old',[`نقص الفوسفور (P) أو برودة الجذور`,`لون أرجواني أو بنفسجي على الأوراق`,`سماد 12-61-0 وتجنّب التربة الباردة المبلّلة`,`تدفئة منطقة الجذور وتجنّب غمر التربة بالماء`],
[`Carence en phosphore (P) ou sol froid`,`Feuilles violacées ou pourpres`,`Engrais 12-61-0; éviter le sol froid et détrempé`,`Réchauffer la zone racinaire, éviter l’excès d’eau`],
[`Phosphorus (P) deficiency or cold roots`,`Purple or violet tint on leaves`,`12-61-0 fertilizer; avoid cold, wet soil`,`Keep the root zone warm, avoid waterlogging`]);
I3('iro','young',[`نقص الحديد (Fe)`,`اصفرار بين العروق في الأوراق الحديثة مع بقاء العروق خضراء`,`حديد مخلّبي EDDHA مع الري أو رشاً ورقياً`,`حافظ على pH بين 6 و7 وأضف كومبوست وتجنّب الجير الزائد`],
[`Carence en fer (Fe)`,`Jaunissement entre les nervures des jeunes feuilles (nervures vertes)`,`Fer chélaté EDDHA en fertigation ou en pulvérisation foliaire`,`Garder un pH de 6 à 7, ajouter du compost, éviter l’excès de calcaire`],
[`Iron (Fe) deficiency`,`Yellowing between veins of young leaves (veins stay green)`,`Fe-EDDHA chelate through irrigation or as a foliar spray`,`Keep pH 6–7, add compost, avoid excess lime`]);
I3('cal','young',[`نقص الكالسيوم (Ca) أو حرق الأطراف`,`احتراق أطراف وحواف الأوراق الحديثة`,`نترات الكالسيوم أسبوعياً مع ري منتظم`,`ري منتظم وتهوية جيدة وتجنّب ارتفاع الملوحة`],
[`Carence en calcium (Ca) ou brûlure des pointes`,`Pointes et bords brûlés sur les jeunes feuilles`,`Nitrate de calcium chaque semaine, irrigation régulière`,`Irrigation régulière, bonne aération, éviter une CE élevée`],
[`Calcium (Ca) deficiency or tipburn`,`Burnt tips and edges on young leaves`,`Calcium nitrate weekly with steady irrigation`,`Steady irrigation, good ventilation, avoid high EC`]);
I3('mic','young',[`نقص بورون/زنك أو إصابة تربس أو فيروس`,`تشوه وتقزم الأوراق الحديثة`,`رش عناصر صغرى مخلّبية وافحص التربس`,`فخاخ لاصقة ونباتات مشاتل سليمة`],
[`Carence en bore/zinc, thrips ou virus`,`Jeunes feuilles déformées et rabougries`,`Pulvériser des oligo-éléments chélatés; vérifier les thrips`,`Pièges collants et plants sains`],
[`Boron/zinc deficiency, thrips or virus`,`Deformed, stunted young leaves`,`Spray chelated micronutrients; check for thrips`,`Sticky traps and clean seedlings`]);
I3('leafspot','leaf',[`تبقع الأوراق / اللفحة المبكرة (فطري)`,`بقع بنية دائرية مع هالة صفراء`,`أزل الأوراق المصابة ورشّ مبيداً نحاسياً كل 7–10 أيام`,`ري بالتنقيط دون رش الأوراق، تهوية، تناوب زراعي`],
[`Taches foliaires / alternariose (champignon)`,`Taches brunes rondes avec halo jaune`,`Retirer les feuilles atteintes; fongicide cuivrique tous les 7–10 jours`,`Goutte-à-goutte sans mouiller le feuillage, aération, rotation`],
[`Leaf spot / early blight (fungal)`,`Round brown spots with a yellow halo`,`Remove infected leaves; copper fungicide every 7–10 days`,`Drip irrigation without wetting leaves, ventilation, crop rotation`]);
I3('lb','leaf',[`اللفحة المتأخرة (فطر)`,`بقع زيتية داكنة تنتشر بسرعة على الأوراق والسيقان في الطقس الرطب`,`أزل النباتات المصابة فوراً ورشّ نحاساً أو مانكوزيب حسب المسموح محلياً`,`أصناف مقاومة، ري صباحاً، تباعد وتهوية`],
[`Mildiou (champignon)`,`Taches huileuses sombres qui s’étendent vite par temps humide`,`Arracher les plants atteints; cuivre ou mancozèbe selon la réglementation locale`,`Variétés résistantes, irrigation le matin, espacement et aération`],
[`Late blight (fungal)`,`Dark oily lesions spreading fast in humid weather`,`Remove affected plants at once; copper or mancozeb as locally permitted`,`Resistant varieties, morning irrigation, spacing and ventilation`]);
I3('powd','leaf',[`البياض الدقيقي`,`مسحوق أبيض على الأوراق`,`كبريت ميكروني أو بيكربونات البوتاسيوم (5 غ/لتر)`,`تهوية، تجنّب الإفراط في النيتروجين، أصناف مقاومة`],
[`Oïdium`,`Poudre blanche sur les feuilles`,`Soufre mouillable ou bicarbonate de potassium (5 g/L)`,`Aération, éviter l’excès d’azote, variétés résistantes`],
[`Powdery mildew`,`White powder on leaves`,`Wettable sulfur or potassium bicarbonate (5 g/L)`,`Ventilation, avoid excess nitrogen, resistant varieties`]);
I3('down','leaf',[`البياض الزغبي`,`بقع صفراء أعلى الورقة وزغب رمادي بنفسجي أسفلها`,`مبيد نحاسي وأزل الأوراق المصابة`,`قلّل الرطوبة وتجنّب الرش على الأوراق`],
[`Mildiou (duveteux)`,`Taches jaunes dessus, duvet gris-violet dessous`,`Fongicide cuivrique; retirer les feuilles atteintes`,`Réduire l’humidité, éviter d’arroser le feuillage`],
[`Downy mildew`,`Yellow patches on top, gray-purple fuzz underneath`,`Copper fungicide; remove infected leaves`,`Lower humidity, avoid wetting foliage`]);
I3('rust','leaf',[`الصدأ`,`بثرات برتقالية أو بنية صدئة على الأوراق`,`أزل الأوراق المصابة ورشّ كبريتاً أو نحاساً`,`تباعد وتهوية وتناوب زراعي`],
[`Rouille`,`Pustules orange ou brun rouille sur les feuilles`,`Retirer les feuilles; soufre ou cuivre`,`Espacement, aération, rotation`],
[`Rust`,`Orange or rusty-brown pustules on leaves`,`Remove infected leaves; sulfur or copper spray`,`Spacing, ventilation, crop rotation`]);
I3('botr','leaf',[`العفن الرمادي (بوتريتس)`,`عفن رمادي زغبي على الأوراق والثمار الرطبة`,`أزل الأجزاء المصابة وقلّل الرطوبة، وجرّب Trichoderma أو مبيداً مسجّلاً`,`تهوية، تجنّب الرطوبة العالية، وإزالة الأوراق السفلية`],
[`Pourriture grise (Botrytis)`,`Moisissure grise duveteuse sur feuilles et fruits humides`,`Retirer les parties atteintes, baisser l’humidité; Trichoderma ou fongicide homologué`,`Aération, éviter l’humidité élevée, éclaircir les feuilles basses`],
[`Gray mold (Botrytis)`,`Fuzzy gray mold on wet leaves and fruit`,`Remove affected parts, lower humidity; Trichoderma or a registered fungicide`,`Ventilation, avoid high humidity, remove lower leaves`]);
I3('blkrot','leaf',[`العفن الأسود البكتيري (الملفوف والقرنبيط)`,`بقع صفراء على شكل V عند حواف الأوراق وعروق سوداء`,`أزل الأوراق المصابة ومبيد نحاسي واتلف البقايا`,`بذور سليمة، تناوب، وتجنّب الرش العلوي`],
[`Nervation noire (chou, chou-fleur)`,`Taches jaunes en V sur les bords, nervures noires`,`Retirer les feuilles atteintes, cuivre, détruire les résidus`,`Semences saines, rotation, éviter l’aspersion`],
[`Black rot (cabbage, cauliflower)`,`V-shaped yellow lesions at leaf edges with black veins`,`Remove infected leaves, copper spray, destroy residues`,`Clean seed, rotation, avoid overhead irrigation`]);
I3('cat','leaf',[`يرقات وحفارات الأوراق (توتا، دودة ورق، دودة الحشد)`,`ثقوب أو أنفاق في الأوراق وبراز يرقات`,`Bt (باسيلوس ثورنجينسيس) أو سبينوساد، وجمع اليرقات يدوياً`,`مصائد فرمونية، شبك مانع للحشرات في البيت المحمي، فحص أسبوعي`],
[`Chenilles et mineuses (Tuta, noctuelles, légionnaire)`,`Trous ou galeries dans les feuilles, déjections`,`Bt (Bacillus thuringiensis) ou spinosad; ramassage manuel`,`Pièges à phéromones, filet anti-insectes en serre, inspection hebdomadaire`],
[`Caterpillars and leaf miners (Tuta, armyworm, fall armyworm)`,`Holes or tunnels in leaves, frass`,`Bt (Bacillus thuringiensis) or spinosad; hand-pick larvae`,`Pheromone traps, insect nets in the greenhouse, weekly scouting`]);
I3('aph','leaf',[`المن`,`حشرات صغيرة خضراء أو سوداء أسفل الأوراق وندوة عسلية لزجة`,`صابون البوتاسيوم أو زيت النيم كل 7 أيام ورشّ الماء بقوة`,`فخاخ لاصقة صفراء، إزالة الأعشاب، وتشجيع الأعداء الحيوية`],
[`Pucerons`,`Petits insectes verts ou noirs sous les feuilles, miellat collant`,`Savon noir ou huile de neem tous les 7 jours; jet d’eau`,`Pièges jaunes, désherbage, auxiliaires`],
[`Aphids`,`Small green or black insects under leaves, sticky honeydew`,`Potassium soap or neem oil every 7 days; strong water jet`,`Yellow sticky traps, weed control, beneficial insects`]);
I3('wf','leaf',[`الذبابة البيضاء`,`حشرات بيضاء صغيرة تطير عند هز النبات وندوة عسلية وأوراق مصفرّة`,`فخاخ صفراء وصابون البوتاسيوم أو زيت النيم كل 5–7 أيام`,`شبك مانع للحشرات، إزالة الأعشاب، ونباتات مشاتل سليمة`],
[`Aleurodes (mouche blanche)`,`Petits insectes blancs qui s’envolent, miellat, feuilles jaunies`,`Pièges jaunes, savon noir ou huile de neem tous les 5–7 jours`,`Filet anti-insectes, désherbage, plants sains`],
[`Whitefly`,`Tiny white insects flying up when shaken, honeydew, yellowing leaves`,`Yellow traps and potassium soap or neem oil every 5–7 days`,`Insect-proof netting, weed control, clean seedlings`]);
I3('mite','leaf',[`العنكبوت الأحمر`,`نسيج عنكبوتي ونقاط صفراء دقيقة على الأوراق في الجو الحار الجاف`,`رشّ الماء أسفل الأوراق، كبريت أو زيت معدني، ومبيد أكاروس عند الإصابة الشديدة`,`خفّف الحرارة والغبار، زد الرطوبة، وافحص أسفل الأوراق أسبوعياً`],
[`Acariens (araignée rouge)`,`Toiles fines et points jaunes sur les feuilles par temps chaud et sec`,`Jet d’eau sous les feuilles, soufre ou huile minérale; acaricide si forte attaque`,`Limiter chaleur et poussière, augmenter l’humidité, inspecter chaque semaine`],
[`Spider mites`,`Fine webbing and yellow stippling on leaves in hot, dry weather`,`Water spray under leaves, sulfur or mineral oil; miticide only if severe`,`Reduce heat stress and dust, raise humidity, scout weekly`]);
I3('thr','leaf',[`التربس`,`خطوط فضية على الأوراق وتشوه الأزهار والأوراق الحديثة`,`سبينوساد أو زيت النيم، فخاخ زرقاء، ورشّ متكرر`,`فخاخ زرقاء، إزالة الأعشاب، شبك مانع للحشرات`],
[`Thrips`,`Traînées argentées, déformation des fleurs et jeunes feuilles`,`Spinosad ou huile de neem; pièges bleus; traitements répétés`,`Pièges bleus, désherbage, filet anti-insectes`],
[`Thrips`,`Silvery streaks and distorted flowers and young leaves`,`Spinosad or neem oil; blue sticky traps; repeat sprays`,`Blue traps, weed control, insect-proof nets`]);
I3('flea','leaf',[`خنفساء البراغيث`,`ثقوب صغيرة كثيرة كطلقات الخردق في الأوراق`,`زيت النيم أو بيريثرين نباتي وغطاء شبكي`,`غطاء شبكي، ري منتظم، وزراعة مبكرة`],
[`Altises`,`Nombreux petits trous en « grains de plomb » dans les feuilles`,`Huile de neem ou pyrèthre naturel; voile anti-insectes`,`Voile anti-insectes, arrosage régulier, semis précoces`],
[`Flea beetles`,`Many tiny shot-holes in leaves`,`Neem oil or natural pyrethrin; row cover`,`Row cover, steady watering, early sowing`]);
I3('ber','fruit',[`عفن الطرف الزهري`,`تعفن وبقعة سوداء في أسفل الثمرة`,`نترات الكالسيوم وري منتظم`,`ري منتظم، تغطية التربة، وتجنّب الإفراط في النيتروجين`],
[`Cul noir (nécrose apicale)`,`Pourriture noire à la base du fruit`,`Nitrate de calcium et irrigation régulière`,`Irrigation régulière, paillage, éviter l’excès d’azote`],
[`Blossom-end rot`,`Dark rotten patch at the base of the fruit`,`Calcium nitrate and steady irrigation`,`Even watering, mulch, avoid excess nitrogen`]);

function restore(I){if(!I)return;['lat','lon','rain','temp','tmax','tmin','crop','sow','area','env','season','irr','ec','soil','comp','plen','pdist','pflow'].forEach(k=>{if(I[k]!==undefined&&I[k]!==null){try{$(k).value=I[k]}catch(_){}}});
document.querySelectorAll('#sym input').forEach(x=>{x.checked=(I.sym||[]).includes(x.dataset.i)})}
function initApp(){applyLang();restore(SAVED);buildSprayUI();renderSP();renderToday();checkNotify();setInterval(checkNotify,60000)}
function getI(){return{lat:$('lat').value,lon:$('lon').value,rain:$('rain').value,temp:$('temp').value,tmax:$('tmax').value,tmin:$('tmin').value,crop:$('crop').value,sow:$('sow').value,area:$('area').value,env:$('env').value,season:$('season').value,irr:$('irr').value,ec:$('ec').value,soil:$('soil').value,comp:$('comp').value,plen:$('plen').value,pdist:$('pdist').value,pflow:$('pflow').value,sym:[...document.querySelectorAll('#sym input:checked')].map(x=>x.dataset.i)}}
function render(){$('out').innerHTML=compute(LAST);$('res').style.display='block'}
function analyze(url){return new Promise(res=>{const im=new Image();im.onload=()=>{const c=document.createElement('canvas');c.width=c.height=80;const x=c.getContext('2d');x.drawImage(im,0,0,80,80);const d=x.getImageData(0,0,80,80).data;let g=0,y=0;for(let i=0;i<d.length;i+=4){const r=d[i]/255,gg=d[i+1]/255,b=d[i+2]/255,mx=Math.max(r,gg,b),mn=Math.min(r,gg,b),df=mx-mn;if(mx<.25||df/mx<.3)continue;let h;if(mx===r)h=((gg-b)/df)%6;else if(mx===gg)h=(b-r)/df+2;else h=(r-gg)/df+4;h*=60;if(h<0)h+=360;if(h>=75&&h<=165)g++;else if(h>=42&&h<75)y++}res(g+y>30?Math.round(100*y/(g+y)):null)};im.onerror=()=>res(null);im.src=url})}
function onPhoto(e){const f=e.target.files[0];if(!f)return;if(PH)URL.revokeObjectURL(PH);PH=URL.createObjectURL(f);YEL=null;$('prev').src=PH;$('prev').style.display='block';e.target.value=''}
$('f1').onchange=onPhoto;$('f2').onchange=onPhoto;
$('cam').onclick=()=>$('f1').click();$('pick').onclick=()=>$('f2').click();
$('lang').onchange=()=>{LANG=$('lang').value;try{localStorage.setItem('fa_lang',LANG)}catch(_){}applyLang()};
$('gps').onclick=()=>{const X=D[LANG].u;if(!navigator.geolocation){alert(X.gpsNA);return}navigator.geolocation.getCurrentPosition(p=>{$('lat').value=p.coords.latitude.toFixed(4);$('lon').value=p.coords.longitude.toFixed(4)},()=>alert(X.gpsF))};
$('wxb').onclick=async()=>{const X=D[LANG].u,lat=$('lat').value,lon=$('lon').value;if(!lat||!lon){alert(X.needC);return}
const b=$('wxb');b.disabled=true;$('wxo').textContent=X.fetch;
try{const u='https://api.open-meteo.com/v1/forecast?latitude='+lat+'&longitude='+lon+'&daily=temperature_2m_max,temperature_2m_min,precipitation_sum,et0_fao_evapotranspiration&past_days=30&forecast_days=7&timezone=auto';
const d=(await (await fetch(u)).json()).daily,p=30;
const hx=d.temperature_2m_max.slice(0,p),hn=d.temperature_2m_min.slice(0,p);
W={ax:avg(hx).toFixed(1),an:avg(hn).toFixed(1),rain:d.precipitation_sum.slice(0,p).reduce((x,y)=>x+y,0).toFixed(1),et:avg(d.et0_fao_evapotranspiration.slice(p-7,p)),fxA:d.temperature_2m_max.slice(p),fnA:d.temperature_2m_min.slice(p)};
$('tmax').value=Math.max(...hx).toFixed(1);$('tmin').value=Math.min(...hn).toFixed(1);
$('wxo').textContent='✅ '+D[LANG].o.wx({ax:W.ax,an:W.an,rain:W.rain,fx:W.fxA.map(Math.round).join('/'),fn:W.fnA.map(Math.round).join('/')});
}catch(e){W={};$('wxo').textContent=X.wxF}
b.disabled=false};
$('go').onclick=async()=>{const X=D[LANG].u;
if(!$('lat').value||!$('lon').value){alert(X.needC);return}
if(PH&&YEL===null)YEL=await analyze(PH);
LAST=getI();SAVED=LAST;try{localStorage.setItem('fa_last',JSON.stringify(LAST))}catch(_){}renderToday();render();
$('cp').onclick=async()=>{try{await navigator.clipboard.writeText($('out').innerText);$('cp').textContent=D[LANG].u.cpd}catch(_){$('cp').textContent=D[LANG].u.cpf}};
$('res').scrollIntoView({behavior:'smooth'})};
initApp();
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
</script>
</body>
</html>
