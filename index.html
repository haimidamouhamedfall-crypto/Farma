<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, minimum-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#2e7d32">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-192.png">
<title>Agri System</title>
<style>
:root{--bg:#f4f7f1;--card:#fff;--tx:#1d2b1f;--mu:#5b6b5e;--pr:#2e7d32;--bd:#d6e0d3;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root{--bg:#121a14;--card:#1b261e;--tx:#e6efe6;--mu:#9db0a0;--pr:#66bb6a;--bd:#2f3f33}}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--tx);font:17px/1.6 system-ui,-apple-system,"Segoe UI",Tahoma,Arial,sans-serif}
.scr{max-width:560px;margin:0 auto;padding:22px 16px}
h1{font-size:24px;margin:10px 0 4px;text-align:center}
.sub{color:var(--mu);text-align:center;margin:0 0 20px}
.logo{display:block;width:84px;height:84px;border-radius:20px;margin:0 auto 6px}
.lgw{display:flex;justify-content:center;margin-bottom:10px}
select{font:inherit;padding:8px 12px;border:1px solid var(--bd);border-radius:10px;background:var(--card);color:var(--tx)}
.opt{display:block;width:100%;text-align:start;font:inherit;color:var(--tx);background:var(--card);border:2px solid var(--bd);border-radius:18px;padding:18px;margin-bottom:14px}
.opt:active{border-color:var(--pr)}
.opt b{display:block;font-size:20px;margin-bottom:4px}
.opt i{font-style:normal;font-size:34px;float:inline-start;margin-inline-end:14px}
.opt span{color:var(--mu);font-size:14px}
.back{font:inherit;font-weight:700;border:1px solid var(--pr);color:var(--pr);background:transparent;border-radius:10px;padding:6px 14px;margin-bottom:10px}
#app{position:fixed;inset:0;display:none;flex-direction:column;background:var(--bg);padding-top:env(safe-area-inset-top,0px)}
#app.on{display:flex}
.bar{display:flex;align-items:center;gap:10px;padding:8px 12px;background:var(--card);border-bottom:1px solid var(--bd)}
.bar button{font:inherit;font-weight:700;border:1px solid var(--pr);color:var(--pr);background:transparent;border-radius:10px;padding:6px 14px}
.bar span{font-weight:700}
iframe{flex:1;width:100%;border:0;background:var(--bg)}
.ver{font-size:12px;color:var(--mu);text-align:center}
</style>
</head>
<body>
<div id="home" class="scr">
<img class="logo" src="icon-192.png" alt="">
<div class="lgw"><select class="lg" onchange="setLang(this.value)"><option value="0">العربية</option><option value="1">Français</option><option value="2">English</option></select></div>
<h1 data-t="t"></h1>
<p class="sub" data-t="s"></p>
<button class="opt" onclick="go('farmer')"><i>👨‍🌾</i><b data-t="f"></b><span data-t="fd"></span></button>
<button class="opt" onclick="go('expert')"><i>🎓</i><b data-t="e"></b><span data-t="ed"></span></button>
<p class="ver">v15</p>
</div>
<div id="exp" class="scr" style="display:none">
<div class="lgw"><select class="lg" onchange="setLang(this.value)"><option value="0">العربية</option><option value="1">Français</option><option value="2">English</option></select></div>
<button class="back" onclick="go('')" data-t="home"></button>
<h1 data-t="et"></h1>
<p class="sub" style="margin-top:12px"></p>
<button class="opt" onclick="go('advisor')"><i>🌾</i><b data-t="ad"></b><span data-t="add"></span></button>
<button class="opt" onclick="go('assess')"><i>📋</i><b data-t="as"></b><span data-t="asd"></span></button>
</div>
<div id="app"><div class="bar"><button id="bk" onclick="up()"></button><span id="bt"></span></div><iframe id="fr" allow="geolocation; camera; microphone; clipboard-write; web-share"></iframe></div>
<script>
var APPS={advisor:"<!DOCTYPE html>\n<html lang=\"ar\" dir=\"rtl\">\n<head>\n<meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1, minimum-scale=1, viewport-fit=cover\">\n<title>Farm Advisor<\/title>\n<style>\n:root{--bg:#f4f7f1;--card:#fff;--tx:#1d2b1f;--mut:#5b6b5e;--pri:#2e7d32;--bd:#d6e0d3;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}\n@media (prefers-color-scheme:dark){:root{--bg:#121a14;--card:#1b261e;--tx:#e6efe6;--mut:#9db0a0;--pri:#66bb6a;--bd:#2f3f33}}\n*{box-sizing:border-box}\nbody{margin:0;background:var(--bg);color:var(--tx);font-family:system-ui,-apple-system,\"Segoe UI\",Tahoma,sans-serif;line-height:1.7}\nmain{max-width:640px;margin:0 auto;padding:16px}\n.top{display:flex;justify-content:space-between;align-items:center;gap:10px}\n.top select{width:auto}\nh1{font-size:1.4rem;margin:8px 0 2px}\n.sub{color:var(--mut);margin:0 0 14px;font-size:.9rem}\n.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:14px;margin-bottom:12px}\n.card h2{font-size:1rem;margin:0 0 10px;color:var(--pri)}\nlabel{display:block;font-size:.85rem;color:var(--mut);margin:8px 0 3px}\ninput,select{width:100%;padding:10px;border-radius:10px;border:1px solid var(--bd);background:var(--bg);color:var(--tx);font-size:1rem;font-family:inherit}\n.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}\nbutton{width:100%;padding:13px;border:0;border-radius:12px;background:var(--pri);color:#fff;font-size:1.05rem;font-weight:600;font-family:inherit;margin-top:10px}\nbutton.sec{background:transparent;color:var(--pri);border:1px solid var(--pri);font-size:.9rem;padding:9px}\nbutton:disabled{opacity:.5}\n#prev,.pimg{max-width:100%;max-height:220px;border-radius:10px;margin-top:8px;display:none}\n.pimg{display:block}\n.res h3{font-size:.95rem;margin:14px 0 4px;color:var(--pri)}\n.res ul{margin:4px 0;padding-inline-start:20px}\n.res p{margin:4px 0}\n.warn{color:#c62828}\n.chk{display:flex;gap:8px;align-items:flex-start;margin:4px 0;font-size:.92rem}\n.chk input{width:auto;margin-top:6px}\n.tr{color:#1565c0}.pv{color:#2e7d32}\ndetails{border:1px solid var(--bd);border-radius:10px;padding:6px 10px;margin:6px 0}\nsummary{font-weight:600}\n.note{font-size:.8rem;color:var(--mut)}\n<\/style>\n<\/head>\n<body>\n<main>\n<div class=\"top\"><h1 id=\"ttl\"><\/h1>\n<select id=\"lang\"><option value=\"ar\">العربية<\/option><option value=\"fr\">Français<\/option><option value=\"en\">English<\/option><\/select><\/div>\n<p class=\"sub\" data-t=\"sub\"><\/p>\n\n<div class=\"card\"><h2 data-t=\"s1\"><\/h2>\n<div class=\"row\"><div><label data-t=\"lat\"><\/label><input id=\"lat\" inputmode=\"decimal\" placeholder=\"16.51\"><\/div>\n<div><label data-t=\"lon\"><\/label><input id=\"lon\" inputmode=\"decimal\" placeholder=\"-15.81\"><\/div><\/div>\n<button class=\"sec\" id=\"gps\" type=\"button\" data-t=\"gps\"><\/button>\n<div class=\"row\"><div><label data-t=\"rain\"><\/label><input id=\"rain\" inputmode=\"decimal\"><\/div>\n<div><label data-t=\"temp\"><\/label><input id=\"temp\" inputmode=\"decimal\"><\/div><\/div>\n<div class=\"row\"><div><label data-t=\"tmax\"><\/label><input id=\"tmax\" inputmode=\"decimal\"><\/div><div><label data-t=\"tmin\"><\/label><input id=\"tmin\" inputmode=\"decimal\"><\/div><\/div>\n<button class=\"sec\" id=\"wxb\" type=\"button\" data-t=\"wxb\"><\/button>\n<div id=\"wxo\" class=\"note\" style=\"white-space:pre-wrap\"><\/div>\n<p class=\"note\" data-t=\"wxnote\"><\/p><\/div>\n\n<div class=\"card\"><h2 data-t=\"s2\"><\/h2>\n<label data-t=\"crop\"><\/label><select id=\"crop\"><\/select>\n<div class=\"row\"><div><label data-t=\"sow\"><\/label><input id=\"sow\" type=\"date\"><\/div>\n<div><label data-t=\"area\"><\/label><input id=\"area\" inputmode=\"decimal\" placeholder=\"1000\"><\/div><\/div>\n<div class=\"row\"><div><label data-t=\"env\"><\/label><select id=\"env\"><\/select><\/div>\n<div><label data-t=\"season\"><\/label><select id=\"season\"><\/select><\/div><\/div>\n<label data-t=\"irr\"><\/label><select id=\"irr\"><\/select>\n<label data-t=\"ec\"><\/label><select id=\"ec\"><\/select><\/div>\n\n<div class=\"card\"><h2 data-t=\"s3\"><\/h2>\n<div class=\"row\"><div><label data-t=\"soil\"><\/label><select id=\"soil\"><\/select><\/div>\n<div><label data-t=\"comp\"><\/label><select id=\"comp\"><\/select><\/div><\/div><\/div>\n\n<div class=\"card\"><h2 data-t=\"s4\"><\/h2>\n<div class=\"row\"><button class=\"sec\" id=\"cam\" type=\"button\" data-t=\"photoCam\"><\/button><button class=\"sec\" id=\"pick\" type=\"button\" data-t=\"photoPick\"><\/button><\/div>\n<input id=\"f1\" type=\"file\" accept=\"image/*\" capture=\"environment\" hidden>\n<input id=\"f2\" type=\"file\" accept=\"image/*\" hidden>\n<img id=\"prev\" alt=\"\">\n<p class=\"note\" data-t=\"photoNote\"><\/p>\n<label data-t=\"symHdr\"><\/label>\n<div id=\"sym\"><\/div><\/div>\n\n<button id=\"go\" type=\"button\" data-t=\"go\"><\/button>\n<div class=\"card res\" id=\"res\" style=\"display:none;margin-top:12px\"><h2 data-t=\"resT\"><\/h2><div id=\"out\"><\/div><button class=\"sec\" id=\"cp\" type=\"button\"><\/button><\/div>\n<p class=\"note\" data-t=\"disc\"><\/p>\n<\/main>\n<script>\nconst IS={};\nfunction I3(id,g,ar,fr,en){IS[id]={g,ar:{n:ar[0],s:ar[1],t:ar[2],p:ar[3]},fr:{n:fr[0],s:fr[1],t:fr[2],p:fr[3]},en:{n:en[0],s:en[1],t:en[2],p:en[3]}}}\nI3('nit','old',[`نقص النيتروجين (N)`,`اصفرار الأوراق السفلى (القديمة) يبدأ من الأسفل`,`سماد غني بالنيتروجين (نترات الأمونيوم أو 30-10-10) مع ماء الري`,`تسميد مجزّأ منتظم وإضافة كومبوست`],\n[`Carence en azote (N)`,`Jaunissement des vieilles feuilles du bas`,`Engrais azoté (nitrate d’ammonium ou 30-10-10) en fertigation`,`Fertilisation fractionnée régulière et compost`],\n[`Nitrogen (N) deficiency`,`Older lower leaves turning uniformly yellow`,`Nitrogen fertilizer (ammonium nitrate or 30-10-10) through irrigation`,`Regular split fertigation and compost`]);\nI3('pot','old',[`نقص البوتاسيوم (K)`,`حواف الأوراق القديمة بنية محروقة مع تجعد`,`نترات البوتاسيوم مع الري`,`تسميد متوازن بالبوتاسيوم وتجنّب الماء المالح`],\n[`Carence en potassium (K)`,`Bords bruns brûlés des vieilles feuilles`,`Nitrate de potassium en fertigation`,`Fertilisation potassique équilibrée, éviter l’eau salée`],\n[`Potassium (K) deficiency`,`Scorched brown edges on older leaves`,`Potassium nitrate through irrigation`,`Balanced potassium feeding; avoid saline water`]);\nI3('mag','old',[`نقص المغنيسيوم (Mg)`,`اصفرار بين العروق مع بقاء العروق خضراء في الأوراق القديمة`,`رش كبريتات المغنيسيوم 0.5% (5 غ/لتر) أسبوعياً لمدة 3 أسابيع`,`تجنّب الإفراط في البوتاسيوم وأضف المغنيسيوم في التسميد`],\n[`Carence en magnésium (Mg)`,`Jaunissement entre les nervures des vieilles feuilles (nervures vertes)`,`Pulvériser du sulfate de magnésium à 0,5 % (5 g/L) chaque semaine pendant 3 semaines`,`Éviter l’excès de potassium; apporter du Mg en fertigation`],\n[`Magnesium (Mg) deficiency`,`Yellowing between veins of older leaves (veins stay green)`,`Spray magnesium sulfate 0.5% (5 g/L) weekly for 3 weeks`,`Avoid excess potassium; include Mg in fertigation`]);\nI3('pho','old',[`نقص الفوسفور (P) أو برودة الجذور`,`لون أرجواني أو بنفسجي على الأوراق`,`سماد 12-61-0 وتجنّب التربة الباردة المبلّلة`,`تدفئة منطقة الجذور وتجنّب غمر التربة بالماء`],\n[`Carence en phosphore (P) ou sol froid`,`Feuilles violacées ou pourpres`,`Engrais 12-61-0; éviter le sol froid et détrempé`,`Réchauffer la zone racinaire, éviter l’excès d’eau`],\n[`Phosphorus (P) deficiency or cold roots`,`Purple or violet tint on leaves`,`12-61-0 fertilizer; avoid cold, wet soil`,`Keep the root zone warm, avoid waterlogging`]);\nI3('iro','young',[`نقص الحديد (Fe)`,`اصفرار بين العروق في الأوراق الحديثة مع بقاء العروق خضراء`,`حديد مخلّبي EDDHA مع الري أو رشاً ورقياً`,`حافظ على pH بين 6 و7 وأضف كومبوست وتجنّب الجير الزائد`],\n[`Carence en fer (Fe)`,`Jaunissement entre les nervures des jeunes feuilles (nervures vertes)`,`Fer chélaté EDDHA en fertigation ou en pulvérisation foliaire`,`Garder un pH de 6 à 7, ajouter du compost, éviter l’excès de calcaire`],\n[`Iron (Fe) deficiency`,`Yellowing between veins of young leaves (veins stay green)`,`Fe-EDDHA chelate through irrigation or as a foliar spray`,`Keep pH 6–7, add compost, avoid excess lime`]);\nI3('cal','young',[`نقص الكالسيوم (Ca) أو حرق الأطراف`,`احتراق أطراف وحواف الأوراق الحديثة`,`نترات الكالسيوم أسبوعياً مع ري منتظم`,`ري منتظم وتهوية جيدة وتجنّب ارتفاع الملوحة`],\n[`Carence en calcium (Ca) ou brûlure des pointes`,`Pointes et bords brûlés sur les jeunes feuilles`,`Nitrate de calcium chaque semaine, irrigation régulière`,`Irrigation régulière, bonne aération, éviter une CE élevée`],\n[`Calcium (Ca) deficiency or tipburn`,`Burnt tips and edges on young leaves`,`Calcium nitrate weekly with steady irrigation`,`Steady irrigation, good ventilation, avoid high EC`]);\nI3('mic','young',[`نقص بورون/زنك أو إصابة تربس أو فيروس`,`تشوه وتقزم الأوراق الحديثة`,`رش عناصر صغرى مخلّبية وافحص التربس`,`فخاخ لاصقة ونباتات مشاتل سليمة`],\n[`Carence en bore/zinc, thrips ou virus`,`Jeunes feuilles déformées et rabougries`,`Pulvériser des oligo-éléments chélatés; vérifier les thrips`,`Pièges collants et plants sains`],\n[`Boron/zinc deficiency, thrips or virus`,`Deformed, stunted young leaves`,`Spray chelated micronutrients; check for thrips`,`Sticky traps and clean seedlings`]);\nI3('leafspot','leaf',[`تبقع الأوراق / اللفحة المبكرة (فطري)`,`بقع بنية دائرية مع هالة صفراء`,`أزل الأوراق المصابة ورشّ مبيداً نحاسياً كل 7–10 أيام`,`ري بالتنقيط دون رش الأوراق، تهوية، تناوب زراعي`],\n[`Taches foliaires / alternariose (champignon)`,`Taches brunes rondes avec halo jaune`,`Retirer les feuilles atteintes; fongicide cuivrique tous les 7–10 jours`,`Goutte-à-goutte sans mouiller le feuillage, aération, rotation`],\n[`Leaf spot / early blight (fungal)`,`Round brown spots with a yellow halo`,`Remove infected leaves; copper fungicide every 7–10 days`,`Drip irrigation without wetting leaves, ventilation, crop rotation`]);\nI3('lb','leaf',[`اللفحة المتأخرة (فطر)`,`بقع زيتية داكنة تنتشر بسرعة على الأوراق والسيقان في الطقس الرطب`,`أزل النباتات المصابة فوراً ورشّ نحاساً أو مانكوزيب حسب المسموح محلياً`,`أصناف مقاومة، ري صباحاً، تباعد وتهوية`],\n[`Mildiou (champignon)`,`Taches huileuses sombres qui s’étendent vite par temps humide`,`Arracher les plants atteints; cuivre ou mancozèbe selon la réglementation locale`,`Variétés résistantes, irrigation le matin, espacement et aération`],\n[`Late blight (fungal)`,`Dark oily lesions spreading fast in humid weather`,`Remove affected plants at once; copper or mancozeb as locally permitted`,`Resistant varieties, morning irrigation, spacing and ventilation`]);\nI3('powd','leaf',[`البياض الدقيقي`,`مسحوق أبيض على الأوراق`,`كبريت ميكروني أو بيكربونات البوتاسيوم (5 غ/لتر)`,`تهوية، تجنّب الإفراط في النيتروجين، أصناف مقاومة`],\n[`Oïdium`,`Poudre blanche sur les feuilles`,`Soufre mouillable ou bicarbonate de potassium (5 g/L)`,`Aération, éviter l’excès d’azote, variétés résistantes`],\n[`Powdery mildew`,`White powder on leaves`,`Wettable sulfur or potassium bicarbonate (5 g/L)`,`Ventilation, avoid excess nitrogen, resistant varieties`]);\nI3('down','leaf',[`البياض الزغبي`,`بقع صفراء أعلى الورقة وزغب رمادي بنفسجي أسفلها`,`مبيد نحاسي وأزل الأوراق المصابة`,`قلّل الرطوبة وتجنّب الرش على الأوراق`],\n[`Mildiou (duveteux)`,`Taches jaunes dessus, duvet gris-violet dessous`,`Fongicide cuivrique; retirer les feuilles atteintes`,`Réduire l’humidité, éviter d’arroser le feuillage`],\n[`Downy mildew`,`Yellow patches on top, gray-purple fuzz underneath`,`Copper fungicide; remove infected leaves`,`Lower humidity, avoid wetting foliage`]);\nI3('rust','leaf',[`الصدأ`,`بثرات برتقالية أو بنية صدئة على الأوراق`,`أزل الأوراق المصابة ورشّ كبريتاً أو نحاساً`,`تباعد وتهوية وتناوب زراعي`],\n[`Rouille`,`Pustules orange ou brun rouille sur les feuilles`,`Retirer les feuilles; soufre ou cuivre`,`Espacement, aération, rotation`],\n[`Rust`,`Orange or rusty-brown pustules on leaves`,`Remove infected leaves; sulfur or copper spray`,`Spacing, ventilation, crop rotation`]);\nI3('botr','leaf',[`العفن الرمادي (بوتريتس)`,`عفن رمادي زغبي على الأوراق والثمار الرطبة`,`أزل الأجزاء المصابة وقلّل الرطوبة، وجرّب Trichoderma أو مبيداً مسجّلاً`,`تهوية، تجنّب الرطوبة العالية، وإزالة الأوراق السفلية`],\n[`Pourriture grise (Botrytis)`,`Moisissure grise duveteuse sur feuilles et fruits humides`,`Retirer les parties atteintes, baisser l’humidité; Trichoderma ou fongicide homologué`,`Aération, éviter l’humidité élevée, éclaircir les feuilles basses`],\n[`Gray mold (Botrytis)`,`Fuzzy gray mold on wet leaves and fruit`,`Remove affected parts, lower humidity; Trichoderma or a registered fungicide`,`Ventilation, avoid high humidity, remove lower leaves`]);\nI3('blkrot','leaf',[`العفن الأسود البكتيري (الملفوف والقرنبيط)`,`بقع صفراء على شكل V عند حواف الأوراق وعروق سوداء`,`أزل الأوراق المصابة ومبيد نحاسي واتلف البقايا`,`بذور سليمة، تناوب، وتجنّب الرش العلوي`],\n[`Nervation noire (chou, chou-fleur)`,`Taches jaunes en V sur les bords, nervures noires`,`Retirer les feuilles atteintes, cuivre, détruire les résidus`,`Semences saines, rotation, éviter l’aspersion`],\n[`Black rot (cabbage, cauliflower)`,`V-shaped yellow lesions at leaf edges with black veins`,`Remove infected leaves, copper spray, destroy residues`,`Clean seed, rotation, avoid overhead irrigation`]);\nI3('cat','leaf',[`يرقات وحفارات الأوراق (توتا، دودة ورق، دودة الحشد)`,`ثقوب أو أنفاق في الأوراق وبراز يرقات`,`Bt (باسيلوس ثورنجينسيس) أو سبينوساد، وجمع اليرقات يدوياً`,`مصائد فرمونية، شبك مانع للحشرات في البيت المحمي، فحص أسبوعي`],\n[`Chenilles et mineuses (Tuta, noctuelles, légionnaire)`,`Trous ou galeries dans les feuilles, déjections`,`Bt (Bacillus thuringiensis) ou spinosad; ramassage manuel`,`Pièges à phéromones, filet anti-insectes en serre, inspection hebdomadaire`],\n[`Caterpillars and leaf miners (Tuta, armyworm, fall armyworm)`,`Holes or tunnels in leaves, frass`,`Bt (Bacillus thur
